# Configuration de « Thothbook »
# Modifie ces valeurs sans toucher au code.

neo4j:
  # Local : bolt://localhost:7687
  # Cloud (Aura) : neo4j+s://xxxxx.databases.neo4j.io  (le +s = connexion chiffrée)
  uri: neo4j+s://cd5df830.databases.neo4j.io
  user: cd5df830
  # Le mot de passe vient du fichier .env (variable NEO4J_PASSWORD)

llm:
  # provider : "google_genai" (Gemini) ou "openai"
  provider: google_genai
  # gemini-3.5-flash : rapide, qualité excellente, très bon rapport coût/qualité.
  model: gemini-3.5-flash
  temperature: 0

# Crédits : solde entier (sans décimales).
credits:
  # 1 € payé = 100 crédits. Garde un chiffre rond et intuitif pour l'utilisateur.
  par_euro: 100
  # 500 crédits offerts à l'inscription = ~55 appels gratuits.
  # Objectif : laisser l'utilisateur remplir tout son graphe (objectifs, tâches, habitudes)
  # avant de lui demander de payer. Coût opérateur : ~2 centimes par utilisateur.
  offert_inscription: 500
  # Pas de minimum artificiel : l'usage réel détermine le coût.
  debit_minimum: 1
  packs:
    - id: decouverte
      label: Pack Découverte
      description: Pour tester l'app sans engagement.
      prix_eur: 5
      credits: 500
      bonus_credits: 0
      badge: Entrée
      ordre: 1
    - id: mensuel
      label: Pack Mensuel
      description: Usage quotidien intense pendant 1 mois complet.
      prix_eur: 20
      credits: 2000
      bonus_credits: 200
      badge: Recommandé
      ordre: 2
    - id: trimestriel
      label: Pack Trimestriel
      description: 3 mois d'usage quotidien avec un bonus généreux.
      prix_eur: 49
      credits: 4900
      bonus_credits: 2000
      badge: Meilleur prix
      ordre: 3

paiements:
  devise: eur

# Tarification du paiement à l'usage.
#
# Calcul : crédits facturés = ceil(coût_réel_€ × marge × par_euro)
#
# Avec gemini-2.0-flash (tarifs Google réels) et marge=200 :
#   Appel typique (1500 tokens in + 700 out) :
#     coût réel = 1500×0.10/1M + 700×0.40/1M = 0.00043€
#     crédits   = ceil(0.00043 × 200 × 100) = 9 crédits/appel
#
#   20€ = 2200 crédits → ~244 appels → 8 appels/jour × 30 jours  (usage intensif quotidien ✓)
#   Marge réelle : 20€ / (244 × 0.00043€) ≈ 190x
#
tarifs:
  marge: 200.0
  defaut:
    input_par_million: 1.50
    output_par_million: 9.00
  modeles:
    gemini-3.5-flash:
      input_par_million: 1.50
      output_par_million: 9.00
    gemini-3.5-flash-lite:
      input_par_million: 0.25
      output_par_million: 1.50
    gemini-3.5-pro:
      input_par_million: 2.00
      output_par_million: 12.00
