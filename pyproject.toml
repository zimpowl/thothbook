[project]
name = "thothbook"
version = "0.1.0"
description = "Thothbook — assistant d'organisation personnelle basé sur un graphe de vie (Neo4j + LLM)."
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "firebase-admin>=6.5",
    "stripe>=10.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
